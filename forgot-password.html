<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background-color: #f2f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; -webkit-font-smoothing: antialiased; }
        .find-container { background-color: #ffffff; padding: 48px 40px; border-radius: 24px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.03); width: 400px; box-sizing: border-box; }
        h2 { margin: 0 0 12px 0; color: #191f28; font-size: 24px; font-weight: 700; text-align: left; line-height: 1.4; }
        .subtitle { font-size: 14px; color: #8b95a1; margin: 0 0 32px 0; text-align: left; line-height: 1.5; }
        .input-group { position: relative; margin-bottom: 12px; }
        input { width: 100%; padding: 16px; background-color: #f9fafb; border: 1px solid transparent; border-radius: 12px; box-sizing: border-box; font-size: 15px; color: #191f28; outline: none; transition: all 0.2s ease; }
        input:hover { background-color: #f2f4f6; }
        input:focus { background-color: #ffffff; border-color: #3182f6; box-shadow: 0 0 0 1px #3182f6; }
        input:disabled { background-color: #e5e8eb; color: #8b95a1; cursor: not-allowed; }
        .toggle-btn { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #8b95a1; cursor: pointer; font-size: 13px; user-select: none; }
        .password-message { font-size: 12px; margin: -6px 0 12px 6px; text-align: left; display: none; font-weight: 500; }
        button { width: 100%; padding: 16px; background-color: #3182f6; color: #ffffff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(49, 130, 246, 0.2); transition: all 0.2s ease; margin-top: 12px; }
        button:hover { background-color: #1b64da; }
        button:active { transform: scale(0.98); }
        .links { margin-top: 28px; text-align: center; font-size: 13px; }
        .links a { color: #4e5968; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="find-container">
        <!-- 1단계: 이메일 입력 화면 -->
        <div id="step-email">
            <h2>비밀번호 재설정</h2>
            <p class="subtitle">가입 시 등록한 이메일 주소를 입력하시면<br>비밀번호를 재설정할 수 있습니다.</p>
            <form id="emailForm">
                <div class="input-group"><input type="email" id="findEmail" placeholder="이메일 주소" required></div>
                <button type="submit">다음</button>
            </form>
        </div>

        <!-- 2단계: 비밀번호 재설정 화면 (평소에는 숨김) -->
        <div id="step-reset" style="display: none;">
            <h2>새 비밀번호 입력</h2>
            <p class="subtitle">안전한 서비스 이용을 위해<br>새로운 비밀번호를 입력해 주세요.</p>
            <form id="resetForm">
                <div class="input-group">
                    <input type="password" id="newPassword" style="padding-right:65px;" placeholder="새 비밀번호 (8자 이상, 조합 필수)" required>
                    <span class="toggle-btn" id="toggleNew">보기</span>
                </div>
                <div id="passwordMsg" class="password-message"></div>
                <div class="input-group" style="margin-bottom: 24px;">
                    <input type="password" id="newPasswordConfirm" style="padding-right:65px;" placeholder="새 비밀번호 확인" required>
                    <span class="toggle-btn" id="toggleConfirm">보기</span>
                </div>
                <button type="submit">비밀번호 저장</button>
            </form>
        </div>
        
        <div class="links"><a href="index.html">로그인 화면으로 돌아가기</a></div>
    </div>

    <script>
        // 보기/숨기기 토글
        const setupToggle = (tId, iId) => {
            document.getElementById(tId).addEventListener('click', function() {
                const input = document.getElementById(iId);
                input.type = input.type === 'password' ? 'text' : 'password';
                this.textContent = input.type === 'password' ? '보기' : '숨기기';
            });
        };
        setupToggle('toggleNew', 'newPassword');
        setupToggle('toggleConfirm', 'newPasswordConfirm');

        let targetEmailKey = "";
        let targetUserData = null;
        let isPassValid = false;

        // 1단계 이메일 검증
        document.getElementById('emailForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('findEmail').value.trim();
            targetEmailKey = `user_${email}`;
            const storedUser = localStorage.getItem(targetEmailKey);

            if (!storedUser) {
                alert('등록되지 않은 이메일 주소입니다.');
                return;
            }

            targetUserData = JSON.parse(storedUser);
            document.getElementById('step-email').style.display = 'none';
            document.getElementById('step-reset').style.display = 'block';
        });

        // 비밀번호 실시간 강도 검증 (가입창 코드 재활용)
        const pInput = document.getElementById('newPassword');
        const pMsg = document.getElementById('passwordMsg');
        pInput.addEventListener('input', function() {
            const v = this.value;
            pMsg.style.display = v ? "block" : "none";
            isPassValid = v.length >= 8 && /[A-Za-z]/.test(v) && /[0-9]/.test(v) && /[^A-Za-z0-9]/.test(v);
            pMsg.textContent = isPassValid ? "✅ 안전한 비밀번호입니다." : "❌ 8자 이상 영문/숫/특 조합 필수";
            pMsg.style.color = isPassValid ? "#2da44e" : "#f04452";
        });

        // 2단계 진짜 새 비밀번호 덮어쓰기 저장
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('newPasswordConfirm').value;

            if (!isPassValid) return alert('비밀번호 보안 규칙을 준수해 주세요.');
            if (password !== confirmPass) return alert('비밀번호가 일치하지 않습니다.');

            // 💡 기존 가입 데이터 무리에서 비밀번호만 교체하여 로컬스토리지 재저장
            targetUserData.password = password;
            localStorage.setItem(targetEmailKey, JSON.stringify(targetUserData));

            alert('비밀번호가 안전하게 재설정되었습니다. 새 정보로 로그인해 주세요.');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
