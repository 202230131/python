<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경</title>
    <style>
        /* 기본 스타일 및 배경 설정 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", helvetica, sans-serif; 
            background-color: #f2f4f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            -webkit-font-smoothing: antialiased; 
        }
        
        /* 카드 레이아웃 */
        .edit-container { 
            background-color: #ffffff; 
            padding: 48px 40px; 
            border-radius: 24px; 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.03); 
            width: 360px;
        }
        
        h2 { 
            margin: 0 0 12px 0; 
            color: #191f28; 
            font-size: 24px; 
            font-weight: 700; 
            text-align: left; 
            line-height: 1.4; 
        }
        
        .section-title { 
            font-size: 14px; 
            font-weight: 600; 
            color: #4e5968; 
            margin: 24px 0 8px 0; 
            text-align: left; 
        }
        
        /* 💡 보기 버튼 배치를 위해 인풋 그룹에 relative 속성 부여 */
        .input-group { 
            position: relative;
            margin-bottom: 12px; 
        }
        
        input { 
            width: 100%; 
            padding: 16px; 
            padding-right: 65px; /* 보기 버튼과 글자가 겹치지 않도록 여백 확보 */
            background-color: #f9fafb;
            border: 1px solid transparent; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 15px; 
            color: #191f28;
            outline: none; 
            transition: all 0.2s ease; 
        }
        input:hover { background-color: #f2f4f6; }
        input:focus { background-color: #ffffff; border-color: #3182f6; box-shadow: 0 0 0 1px #3182f6; }
        
        /* 💡 index.html과 통일된 텍스트 형태의 토글 버튼 스타일 */
        .toggle-btn { 
            position: absolute; 
            right: 16px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #8b95a1; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 500; 
            user-select: none; 
            transition: color 0.2s ease; 
        }
        .toggle-btn:hover { color: #4e5968; }

        .last-input { margin-bottom: 24px; }
        
        button[type="submit"] { width: 100%; padding: 16px; background-color: #3182f6; color: #ffffff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(49, 130, 246, 0.2); transition: all 0.2s ease; }
        button[type="submit"]:hover { background-color: #1b64da; box-shadow: 0 6px 16px rgba(49, 130, 246, 0.3); }
        button[type="submit"]:active { transform: scale(0.98); }
        
        .btn-back { display: block; width: 100%; padding: 16px; background-color: #f2f4f6; color: #4e5968; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; margin-top: 12px; transition: all 0.2s ease; }
        .btn-back:hover { background-color: #e5e8eb; color: #191f28; }
        .btn-back:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="edit-container">
        <h2>비밀번호 변경</h2>
        <form id="editPasswordForm">
            <div class="section-title">새 비밀번호</div>
            <!-- 1번째 입력창 그룹 -->
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="새 비밀번호 (8자 이상)" minlength="8" required>
                <span class="toggle-btn" id="toggleNewPassword">보기</span>
            </div>
            
            <!-- 2번째 입력창 그룹 -->
            <div class="input-group last-input">
                <input type="password" id="newPasswordConfirm" placeholder="새 비밀번호 확인" required>
                <span class="toggle-btn" id="toggleConfirmPassword">보기</span>
            </div>
            
            <button type="submit">비밀번호 저장</button>
            <a href="main.html" class="btn-back">이전으로 돌아가기</a>
        </form>
    </div>

    <script>
        // 💡 [보안 가드막] 로그인 안 한 유저 강제 추방
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                alert('로그인이 필요한 서비스입니다.');
                window.location.href = 'index.html';
            }
        });

        const setupToggle = (tId, iId) => {
            document.getElementById(tId).addEventListener('click', function() {
                const input = document.getElementById(iId);
                input.type = input.type === 'password' ? 'text' : 'password';
                this.textContent = input.type === 'password' ? '보기' : '숨기기';
            });
        };
        setupToggle('toggleNew', 'newPassword');
        setupToggle('toggleConfirm', 'newPasswordConfirm');

        document.getElementById('editPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const password = document.getElementById('newPassword').value;
            const passwordConfirm = document.getElementById('newPasswordConfirm').value;
            
            if (password !== passwordConfirm) {
                alert('새 비밀번호가 서로 일치하지 않습니다.');
                return;
            }
            
            let userUpdated = false;
            const currentNickname = localStorage.getItem('userNickname');

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('user_')) {
                    const userData = JSON.parse(localStorage.getItem(key));
                    if (userData.name === currentNickname) {
                        userData.password = password; 
                        localStorage.setItem(key, JSON.stringify(userData)); 
                        userUpdated = true;
                        break;
                    }
                }
            }

            if (userUpdated) {
                alert('비밀번호가 변경되었습니다. 다시 로그인 해주세요.');
                localStorage.removeItem('isLoggedIn'); // 보안을 위해 상태 파기
                window.location.href = 'index.html'; 
            }
        });
    </script>
</body>
</html>
