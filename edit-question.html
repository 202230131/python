<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>본인확인 질문 변경</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", helvetica, sans-serif; background-color: #f2f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; -webkit-font-smoothing: antialiased; padding: 20px 0;}
        .edit-container { background-color: #ffffff; padding: 48px 40px; border-radius: 24px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.03); width: 360px; }
        h2 { margin: 0 0 12px 0; color: #191f28; font-size: 24px; font-weight: 700; text-align: left; line-height: 1.4; }
        .section-title { font-size: 14px; font-weight: 600; color: #4e5968; margin: 24px 0 8px 0; text-align: left; }
        .input-group { margin-bottom: 12px; }
        .last-group { margin-bottom: 24px; }
        input, select { width: 100%; padding: 16px; background-color: #f9fafb; border: 1px solid transparent; border-radius: 12px; box-sizing: border-box; font-size: 15px; color: #191f28; outline: none; transition: all 0.2s ease; appearance: none; -webkit-appearance: none; }
        select { background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%238b95a1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 16px center; background-size: 16px; cursor: pointer; }
        input:hover, select:hover { background-color: #f2f4f6; }
        input:focus, select:focus { background-color: #ffffff; border-color: #3182f6; box-shadow: 0 0 0 1px #3182f6; }
        button[type="submit"] { width: 100%; padding: 16px; background-color: #3182f6; color: #ffffff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(49, 130, 246, 0.2); transition: all 0.2s ease; }
        button[type="submit"]:hover { background-color: #1b64da; box-shadow: 0 6px 16px rgba(49, 130, 246, 0.3); }
        button[type="submit"]:active { transform: scale(0.98); }
        .btn-back { display: block; width: 100%; padding: 16px; background-color: #f2f4f6; color: #4e5968; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; margin-top: 12px; transition: all 0.2s ease; }
        .btn-back:hover { background-color: #e5e8eb; color: #191f28; }
        .btn-back:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="edit-container">
        <h2>본인확인 질문 변경</h2>
        <form id="editQuestionForm">
            <div class="section-title">새로운 확인 질문</div>
            <div class="input-group">
                <select id="question" required>
                    <option value="" disabled selected>질문을 선택해주세요</option>
                    <option value="q1">가장 기억에 남는 선생님 성함은?</option>
                    <option value="q2">처음 키웠던 반려동물의 이름은?</option>
                    <option value="q3">받았던 선물 중 가장 기억에 남는 것은?</option>
                    <option value="q4">가장 좋아하는 색깔은?</option>
                    <option value="q5">자신의 보물 제1호는?</option>
                    <option value="q6">자신의 인생 좌우명은?</option>
                    <option value="q7">가장 좋아하는 음식은?</option>
                    <option value="q8">어렸을 때 별명은?</option>
                    <option value="q9">처음 입학한 학교의 이름은?</option>
                    <option value="q10">인생에서 가장 기억에 남는 여행지는?</option>
                    <option value="q11">가장 즐겨듣는 음악은?</option>
                </select>
            </div>
            <div class="input-group last-group">
                <input type="text" id="answer" placeholder="새로운 답변 입력" required>
            </div>
            <button type="submit">질문 저장</button>
            <a href="main.html" class="btn-back">이전으로 돌아가기</a>
        </form>
    </div>

    <script>
        // 💡 [보안 가드막] 로그인 안 한 유저 강제 추방
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                alert('로그인이 필요한 서비스입니다.');
                window.location.href = 'index.html';
            }
        });

        document.getElementById('editQuestionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const question = document.getElementById('question').value;
            const answer = document.getElementById('answer').value.trim();
            const currentNickname = localStorage.getItem('userNickname');

            let userUpdated = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('user_')) {
                    const userData = JSON.parse(localStorage.getItem(key));
                    if (userData.name === currentNickname) {
                        userData.question = question; 
                        userData.answer = answer;     
                        localStorage.setItem(key, JSON.stringify(userData)); 
                        userUpdated = true;
                        break;
                    }
                }
            }

            if (userUpdated) {
                alert('본인확인 질문과 답변이 수정되었습니다.');
                window.location.href = 'main.html';
            }
        });
    </script>
</body>
</html>
